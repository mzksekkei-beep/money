<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>使えるお金</title>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f4;--surface:#fff;--ink:#12313a;--sub:#5d7480;--line:#d3dde2;--ok:#0d7a5f;--ng:#c0392b;--btn:#12313a;--btn-ink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c21;--surface:#17282f;--ink:#e6f0f3;--sub:#8fa8b3;--line:#2a3f48;--ok:#4cd1a5;--ng:#ff7b6b;--btn:#e6f0f3;--btn-ink:#0f1c21}}
:root[data-theme="dark"]{--bg:#0f1c21;--surface:#17282f;--ink:#e6f0f3;--sub:#8fa8b3;--line:#2a3f48;--ok:#4cd1a5;--ng:#ff7b6b;--btn:#e6f0f3;--btn-ink:#0f1c21}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;font-size:20px;line-height:1.5}
main{max-width:480px;margin:0 auto;padding:20px 16px 120px}
h1{font-size:22px;font-weight:400;color:var(--sub);margin:0 0 4px}
.result{font-size:56px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:0 0 20px}
.result.ng{color:var(--ng)}.result.ok{color:var(--ok)}
.hero{background:#12313a;border-radius:14px;padding:16px;margin-bottom:20px}
.hero h1{font-size:26px;color:#fff;margin:0 0 4px}
.hero .result{font-size:60px;margin:0}
.hero .result.ok{color:#fff}
.hero .result.ng{color:#ffb4a8}
.hero .tl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;color:#fff;font-size:22px;margin:12px 0 0;border-top:1px solid rgba(255,255,255,.3);padding-top:10px}
.hero .tl b{font-size:30px;font-variant-numeric:tabular-nums}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:20px;color:var(--sub);margin-bottom:6px}
input,select{width:100%;font:inherit;font-size:26px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.row input:first-child{flex:1.4}.row input:last-child{flex:1}
.dl{font-size:22px;white-space:nowrap}
#date,#start{flex:1;min-width:0;width:auto}
button.add{width:100%;font:inherit;font-size:24px;font-weight:700;background:var(--btn);color:var(--btn-ink);border:0;border-radius:10px;padding:15px;cursor:pointer}
button.cancel{width:100%;font:inherit;font-size:22px;background:none;color:var(--sub);border:0;padding:10px;cursor:pointer;margin-top:4px}
ul{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:36px 1fr auto auto;align-items:center;column-gap:8px;padding:14px 0;font-size:26px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li .n{flex:1;word-break:break-all}
li .a{grid-column:2/5;grid-row:2;font-weight:700;font-variant-numeric:tabular-nums}
li .m{grid-column:2/5;grid-row:3;text-align:left;color:var(--sub);font-size:22px;line-height:1.4}
li button{font:inherit;background:none;border:0;color:var(--sub);font-size:32px;line-height:1;padding:8px 10px;cursor:pointer}
li input[type=checkbox]{width:36px;height:36px;padding:0;flex:none;accent-color:var(--ok)}
li .sp{width:36px}
li.done .n,li.done .a{text-decoration:line-through;opacity:.5}
li.off{opacity:.55}
li.flash{background:rgba(13,122,95,.2)}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#odate{flex:1;width:auto}
textarea{width:100%;font:inherit;font-size:20px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-top:8px;resize:vertical}
button.add.half{flex:1;width:auto;font-size:20px;padding:12px 6px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.fgrid button{font:inherit;font-size:24px;font-weight:700;padding:14px 6px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.fgrid button.on{background:var(--ok);border-color:var(--ok);color:var(--btn-ink)}
.mgrid button{font:inherit;font-size:24px;font-weight:700;padding:12px 0;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.mgrid button.on{background:var(--ok);border-color:var(--ok);color:var(--btn-ink)}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;min-height:58px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.sum{display:flex;flex-direction:column;gap:2px;background:#12313a;color:#fff;border-radius:12px;padding:14px 16px;margin:4px 0 10px;font-size:22px}
.sum #total{font-size:40px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.empty{color:var(--sub);font-size:22px;margin:4px 0}
.hint{font-size:20px;color:var(--sub);margin:8px 0 0}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.dbox{background:var(--surface);color:var(--ink);border-radius:16px;padding:20px;max-width:420px;width:100%}
.dbox p{font-size:26px;margin:0 0 18px;word-break:break-all}
.drow{display:flex;gap:10px}
.drow button{flex:1;font:inherit;font-size:24px;font-weight:700;border-radius:12px;padding:14px;cursor:pointer;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.drow #dyes{background:var(--ng);border-color:var(--ng);color:#fff}
</style>
</head>
<body>
<main>
  <div class="hero"><h1 id="ttl">使えるお金</h1>
  <p class="result ok" id="result">¥0</p><p class="tl"><span>今日の残高予想</span><b id="tdy">¥0</b></p></div>

  <div class="box">
    <label for="bal">口座残高</label>
    <input id="bal" type="text" inputmode="numeric" placeholder="例: 250,000" autocomplete="off">
    <p class="hint" id="balnote" style="margin:8px 0 0"></p>
    <label for="pay" style="margin-top:14px">次の給料日</label>
    <input id="pay" type="date">
  </div>

  <div class="box">
    <label>引かれる項目</label>
    <div class="sum"><span id="sumlbl">今月これから引かれる合計</span><span id="total">¥0</span></div>
    <ul id="list"></ul>
    <p class="empty" id="empty">まだ項目がありません。下の「項目を追加」から入れてください。</p>
    <p class="hint">引かれたらチェック。次の給料日の前日までに引かれない項目は、最初からチェックが入り、計算に入りません。</p>
    
  </div>

  <div class="box">
    <label>項目を追加</label>
    <div class="row">
      <input id="name" type="text" placeholder="項目名" autocomplete="off">
      <input id="amt" type="text" inputmode="numeric" placeholder="金額" autocomplete="off">
    </div>
    <div class="row">
      <span class="dl">引き落とし日</span><input id="date" type="text" inputmode="numeric" placeholder="25" aria-label="引き落とし日 (日にちだけ)" autocomplete="off"><span class="dl">日</span>
    </div>
    <div class="row" id="oncerow" style="display:none"><span class="dl">引き落とし日</span><input id="odate" type="date" aria-label="引き落とし日"></div>
    <div id="fgrid" class="fgrid"></div><select id="freq" style="display:none" aria-label="頻度"></select>
    <div id="monthrow" style="display:none;margin-bottom:8px"><div class="dl" style="margin-bottom:6px">引かれる月をえらぶ (複数可)</div><div class="mgrid" id="mgrid"></div><p class="hint" id="mhint" style="display:none;color:var(--ng)">月を1つ以上えらんでください</p></div>
    <button class="add" id="add">項目を追加</button>
    <button class="cancel" id="cancel" style="display:none">編集をやめる</button>
  </div>
<div class="box">
    <label>引き継ぎ (残高・給料日・項目)</label>
    <p class="hint" style="margin:0 0 8px">機種変更のときは、元のスマホで「書き出す」→「コピー」を押して、LINEなどで自分に送ります。新しいスマホでは、貼り付けて「置き換えて取り込む」を押します。</p>
    <div class="row"><button class="add half" id="exp">書き出す</button><button class="add half" id="cpy">コピー</button></div>
    <textarea id="io" rows="4" placeholder="ここに書き出したデータが出ます。取り込むときは、ここに貼り付けます。"></textarea>
    <div class="row" style="margin-top:8px"><button class="add half" id="impadd">追加で取り込む</button><button class="add half" id="imprep">置き換えて取り込む</button></div>
    <p class="hint" id="iomsg"></p>
  </div>
</main>
<div id="dlg" class="dlg" style="display:none"><div class="dbox"><p id="dmsg"></p><div class="drow"><button id="dno">やめる</button><button id="dyes">削除する</button></div></div></div>
<script>
var F=[{k:"m1",t:"毎月",n:1},{k:"once",t:"1回のみ (日付をえらぶ)",once:1},{k:"even",t:"偶数月 (2・4・6…月)",n:2,s:2},{k:"odd",t:"奇数月 (1・3・5…月)",n:2,s:1},{k:"pick",t:"隔月など (月をえらぶ)",pick:1}];
var items=[],bal=0,balDate="",editIdx=-1,payday="",selM=[];
var $=function(i){return document.getElementById(i)};
function yen(n){return (n<0?"-":"")+"¥"+Math.abs(Math.round(n)).toLocaleString("ja-JP")}
function num(s){var v=parseFloat(String(s).replace(/[,，¥円\s]/g,"").replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248)}));return isNaN(v)?0:v}
function cm(){return new Date().getMonth()+1}
function ym(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)}
function fdef(k){return F.filter(function(f){return f.k===k})[0]||F[0]}
function mlist(it){var f=fdef(it.freq),r=[];if(f.once)return it.once?[+it.once.split("-")[1]]:[];if(f.pick)return (it.months||[]).slice().sort(function(a,b){return a-b});for(var m=1;m<=12;m++){if(((m-(f.s||1))%f.n+f.n)%f.n===0)r.push(m)}return r}
function pad(n){return n<10?"0"+n:""+n}
function ds(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function dim(y,m){return new Date(y,m+1,0).getDate()}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function nextPay(){if(!payday)return null;var p=payday.split("-"),y=+p[0],m=+p[1]-1,day=+p[2],t=today();for(var i=0;i<600;i++){var c=new Date(y,m,Math.min(day,dim(y,m)));if(c>t)return c;m++;if(m>11){m=0;y++}}return null}
function pEnd(){var np=nextPay(),t=today();return np?addDays(np,-1):new Date(t.getFullYear(),t.getMonth()+1,0)}
function hit(it,D){if(it.freq==="once")return ds(D)===it.once;if(mlist(it).indexOf(D.getMonth()+1)<0)return false;if(!it.date)return D.getDate()===1||ds(D)===ds(today());return D.getDate()===Math.min(it.date,dim(D.getFullYear(),D.getMonth()))}
var HC={};
function mon(y,m,n){var w=new Date(y,m,1).getDay();return 1+((8-w)%7)+(n-1)*7}
function hols(y){
  if(HC[y])return HC[y];
  var h={},k=function(m,d){return m+"-"+d},add=function(m,d){h[k(m,d)]=1},fy=y-1980,ld=Math.floor(fy/4);
  add(1,1);add(1,mon(y,0,2));add(2,11);add(2,23);add(3,Math.floor(20.8431+0.242194*fy-ld));
  add(4,29);add(5,3);add(5,4);add(5,5);add(7,mon(y,6,3));add(8,11);add(9,mon(y,8,3));
  add(9,Math.floor(23.2488+0.242194*fy-ld));add(10,mon(y,9,2));add(11,3);add(11,23);
  var base=Object.keys(h).map(function(s){var p=s.split("-");return new Date(y,p[0]-1,p[1])});
  var ex=[];
  base.forEach(function(D){var N=addDays(D,2),M=addDays(D,1);if(h[k(N.getMonth()+1,N.getDate())]&&!h[k(M.getMonth()+1,M.getDate())]&&M.getDay()!==0&&M.getFullYear()===y)ex.push(M)});
  ex.forEach(function(M){add(M.getMonth()+1,M.getDate())});
  base.forEach(function(D){if(D.getDay()===0){var E=addDays(D,1);while(h[k(E.getMonth()+1,E.getDate())])E=addDays(E,1);if(E.getFullYear()===y)add(E.getMonth()+1,E.getDate())}});
  add(12,31);add(1,2);add(1,3);
  return HC[y]=h;
}
function isBiz(D){var w=D.getDay();return w!==0&&w!==6&&!hols(D.getFullYear())[(D.getMonth()+1)+"-"+D.getDate()]}
function nb(D){while(!isBiz(D))D=addDays(D,1);return D}
function occs(it){var t=today(),e=pEnd(),r=[],seen={};for(var D=addDays(t,-10);D<=e;D=addDays(D,1)){if(hit(it,D)){var A=it.date?nb(D):D;if(A>=t&&A<=e){var k=ds(A);if(!seen[k]){seen[k]=1;r.push(A)}}}}return r}
function occR(it,s,e){var r=[],seen={};for(var D=addDays(s,-10);D<=e;D=addDays(D,1)){if(hit(it,D)){var A=it.date?nb(D):D;if(A>=s&&A<=e){var k=ds(A);if(!seen[k]){seen[k]=1;r.push(A)}}}}return r}
function pastInfo(){var o={sum:0,n:0};if(!bal||!balDate)return o;var t=today(),p=balDate.split("-"),B=new Date(+p[0],+p[1]-1,+p[2]),s=addDays(B,1),lim=addDays(t,-366),e=addDays(t,-1);if(s<lim)s=lim;if(s>e)return o;items.forEach(function(it){occR(it,s,e).forEach(function(){o.sum+=it.amt;o.n++})});return o}
function occ(it){var r=occs(it);return r.length?r[0]:null}
function after(it){var e=pEnd();if(it.freq==="once"){var p=(it.once||"").split("-"),S=new Date(+p[0],+p[1]-1,+p[2]),A=nb(S);return A>e?A:null}var lim=addDays(e,400);for(var D=addDays(e,-10);D<=lim;D=addDays(D,1)){if(mlist(it).indexOf(D.getMonth()+1)>=0&&(!it.date||D.getDate()===Math.min(it.date,dim(D.getFullYear(),D.getMonth())))){var A=it.date?nb(D):D;if(A>e)return A}}return addDays(e,1)}
function lbl(D){return (D.getMonth()+1)+"月"+D.getDate()+"日"}
function sh(it,o){return o.getDate()!==Math.min(it.date,dim(o.getFullYear(),o.getMonth()))?"・休日のため翌平日":""}
function desc(it){return it.freq==="once"?"1回のみ":fdef(it.freq).n===1?"毎月":mlist(it).join("・")+"月"}
function rank(it){var o=occ(it);return !o?2:(it.doneKey===ds(o)?1:0)}
function save(){try{localStorage.setItem("zandaka",JSON.stringify({bal:bal,balDate:balDate,payday:payday,items:items}))}catch(e){}}
function load(){try{var d=JSON.parse(localStorage.getItem("zandaka")||"null");if(d){bal=d.bal||0;balDate=d.balDate||(d.bal?ds(today()):"");payday=d.payday||"";items=(d.items||[]).map(function(i){if(typeof i.date==="string")i.date=i.date?+i.date.split("-")[2]:0;if(!i.freq){i.freq="m1";i.start=1}if(/^m(2|3|6|12)$/.test(i.freq)){var nn=+i.freq.slice(1),ss=i.start||1,ms=[];for(var q=1;q<=12;q++){if(((q-ss)%nn+nn)%nn===0)ms.push(q)}i.freq="pick";i.months=ms;delete i.start}delete i.done;if(/^\d{4}-\d{2}-\d{2}$/.test(i.doneKey||"")&&!i.doneKeys)i.doneKeys=[i.doneKey];i.doneKey="";if(!i.doneKeys)i.doneKeys=[];return i})}}catch(e){}}
function render(){
  var t=0,ent=[];
  items.forEach(function(it,idx){
    var os=occs(it),dk=it.doneKeys||[];
    if(os.length){os.forEach(function(A){var dn=dk.indexOf(ds(A))>=0;if(!dn)t+=it.amt;ent.push({it:it,idx:idx,A:A,rk:dn?1:0})})}
    else ent.push({it:it,idx:idx,A:null,rk:2});
  });
  var pi=pastInfo(),eff=bal-pi.sum,r=eff-t;
  $("ttl").textContent=lbl(pEnd())+"まで使えるお金";$("sumlbl").textContent=payday?"給料日前日までに引かれる合計":"月末までに引かれる合計";
  $("result").textContent=yen(r);
  var bn="";if(balDate){var bp=balDate.split("-");bn="残高を入れた日: "+(+bp[1])+"月"+(+bp[2])+"日。";if(pi.sum>0)bn+="その後に引かれた分 "+yen(pi.sum)+"("+pi.n+"件)を、自動で引いています。実際の残高と違うときは、入れ直してください。"}
  $("balnote").textContent=bn;
  $("result").className="result "+(r<0?"ng":"ok");
  $("total").textContent=yen(t);
  var td=eff;ent.forEach(function(en){if(en.rk===0&&ds(en.A)===ds(today()))td-=en.it.amt});
  $("tdy").textContent=yen(td);$("tdy").style.color=td<0?"#ffb4a8":"#fff";
  $("empty").style.display=items.length?"none":"block";
  var far=new Date(9999,0,1);
  ent.sort(function(x,y){if(x.rk!==y.rk)return x.rk-y.rk;var xa=x.rk===2?(after(x.it)||far):x.A,ya=y.rk===2?(after(y.it)||far):y.A;return (xa-ya)||((x.it.date||99)-(y.it.date||99))});
  var ul=$("list");ul.innerHTML="";
  ent.forEach(function(en){
    var it=en.it,idx=en.idx,rk=en.rk,A=en.A;
    var li=document.createElement("li");li.setAttribute("data-i",idx);li.className=rk===1?"done":(rk===2?"off":"");
    var box=document.createElement("input");box.type="checkbox";
    if(rk===2){box.checked=true;box.disabled=true;box.setAttribute("aria-label",it.name+"は今回は引かれない")}
    else{box.checked=rk===1;box.setAttribute("aria-label",it.name+"は引かれた");box.onchange=function(){var k=ds(A),dk=it.doneKeys||[],q=dk.indexOf(k);if(box.checked&&q<0)dk.push(k);if(!box.checked&&q>=0)dk.splice(q,1);it.doneKeys=dk;save();render()}}
    var n=document.createElement("span");n.className="n";n.textContent=it.name;
    var d=document.createElement("small");
    d.textContent=rk===2?(after(it)?"今回はなし・次は"+(it.date?lbl(after(it)):(after(it).getMonth()+1)+"月"):"1回のみ・終了"):(it.date?lbl(A):(A.getMonth()+1)+"月")+"・"+desc(it)+(it.date?sh(it,A):"")+(rk===1?"・引き落とし済み":"");
    d.className="m";
    var a=document.createElement("span");a.className="a";a.textContent=yen(it.amt);
    var e=document.createElement("button");e.textContent="✎";e.setAttribute("aria-label",it.name+"を編集");e.onclick=function(){startEdit(idx)};
    var b=document.createElement("button");b.textContent="×";b.setAttribute("aria-label",it.name+"を削除");
    b.onclick=function(){askDel(idx)};
    li.appendChild(box);li.appendChild(n);li.appendChild(a);li.appendChild(e);li.appendChild(b);li.appendChild(d);ul.appendChild(li);
  });
}
function askDel(idx){var it=items[idx];$("dyes").textContent="削除する";$("dmsg").textContent="「"+it.name+"」を削除しますか？";$("dlg").style.display="flex";$("dyes").onclick=function(){$("dlg").style.display="none";resetForm();items.splice(idx,1);save();render()};$("dno").onclick=function(){$("dlg").style.display="none"};$("dno").focus()}
function exportText(){return "ZANDAKA2:"+JSON.stringify({bal:bal,balDate:balDate,payday:payday,items:items.map(function(i){return {name:i.name,amt:i.amt,date:i.date||0,freq:i.freq,months:i.months||[],once:i.once||"",doneKeys:(i.doneKeys||[]).slice(-12)}})})}
function ioMsg(t){$("iomsg").textContent=t}
function parseIn(){var s=$("io").value.replace(/[\r\n]/g,""),k=s.indexOf("ZANDAKA2:"),v=2;if(k<0){k=s.indexOf("ZANDAKA1:");v=1}if(k<0)return null;try{var o=JSON.parse(s.slice(k+9)),a=v===2?o.items:o;if(!Array.isArray(a))return null;var keys=F.map(function(f){return f.k}),dre=/^\d{4}-\d{2}-\d{2}$/;var list=a.map(function(x){var f=keys.indexOf(x.freq)>=0?x.freq:"m1",ms=(x.months||[]).map(Number).filter(function(m){return m>=1&&m<=12}),once=dre.test(x.once||"")?x.once:"";if(f==="once"&&!once)f="m1";if(f==="pick"&&!ms.length)f="m1";return {name:String(x.name||"項目"),amt:Number(x.amt)||0,date:Math.min(31,Math.max(0,Math.round(Number(x.date)||0))),freq:f,months:ms,once:once,doneKeys:Array.isArray(x.doneKeys)?x.doneKeys.filter(function(z){return dre.test(z)}):[]}}).filter(function(x){return x.amt});return {items:list,bal:v===2?(Number(o.bal)||0):null,payday:v===2?(dre.test(o.payday||"")?o.payday:""):null,balDate:v===2&&dre.test(o.balDate||"")?o.balDate:"",v:v}}catch(e){return null}}
function askOk(msg,label,fn){$("dmsg").textContent=msg;$("dyes").textContent=label;$("dlg").style.display="flex";$("dyes").onclick=function(){$("dlg").style.display="none";fn()};$("dno").onclick=function(){$("dlg").style.display="none"};$("dno").focus()}
function doImport(rep){var p=parseIn();if(!p||(p.v===1&&!p.items.length)){ioMsg("取り込めるデータが見つかりません。書き出したデータを、そのまま貼り付けてください。");return}var a=p.items;var go=function(){resetForm();if(rep){items=a;if(p.v===2){bal=p.bal;payday=p.payday;balDate=p.balDate||ds(today());$("bal").value=bal?bal.toLocaleString("ja-JP"):"";$("pay").value=payday}}else{items=items.concat(a)}save();render();ioMsg(rep&&p.v===2?"引き継ぎが終わりました。("+a.length+"件)":a.length+"件を取り込みました。")};if(rep)askOk(p.v===2?"今の残高・給料日・項目をすべて消して、引き継ぎデータに置き換えますか？":"今の項目をすべて消して、"+a.length+"件に置き換えますか？","置き換える",go);else go()}
function goItem(i){setTimeout(function(){var el=document.querySelector('li[data-i="'+i+'"]');if(el){el.scrollIntoView({block:"center",behavior:"smooth"});el.classList.add("flash");setTimeout(function(){el.classList.remove("flash")},1800)}},50)}
function setM(arr){selM=arr.slice();$("mhint").style.display="none";[].forEach.call($("mgrid").children,function(b){b.className=selM.indexOf(+b.getAttribute("data-m"))>=0?"on":""})}
function toggleStart(){var f=fdef($("freq").value);[].forEach.call($("fgrid").children,function(b){b.className=b.getAttribute("data-k")===f.k?"on":""});$("monthrow").style.display=f.pick?"block":"none";$("oncerow").style.display=f.once?"flex":"none";$("date").parentNode.style.display=f.once?"none":"flex"}
function resetForm(){editIdx=-1;$("name").value="";$("amt").value="";$("date").value="";$("freq").value="m1";setM([]);$("odate").value="";toggleStart();$("add").textContent="項目を追加";$("cancel").style.display="none"}
function startEdit(idx){var it=items[idx];editIdx=idx;$("name").value=it.name;$("amt").value=it.amt;$("date").value=it.date||"";$("freq").value=it.freq;setM(it.months||[]);$("odate").value=it.once||"";toggleStart();$("add").textContent="変更を保存";$("cancel").style.display="block";$("name").scrollIntoView({block:"center"});$("name").focus()}
function addItem(){
  var a=num($("amt").value);
  if(!a){$("amt").focus();return}
  if(fdef($("freq").value).pick&&!selM.length){$("mhint").style.display="block";$("monthrow").scrollIntoView({block:"center"});return}
  if(fdef($("freq").value).once&&!$("odate").value){$("odate").focus();return}
  var obj={name:$("name").value.trim()||"項目",amt:a,date:Math.min(31,Math.max(0,Math.round(num($("date").value))))||0,freq:$("freq").value,months:selM.slice(),once:$("odate").value};
  if(obj.freq==="once"){obj.date=+obj.once.split("-")[2]}else{obj.once=""}var ed=editIdx;if(editIdx>=0){var o=items[editIdx];o.name=obj.name;o.amt=obj.amt;o.date=obj.date;o.freq=obj.freq;o.months=obj.months;o.once=obj.once}else{obj.doneKey="";items.push(obj);ed=items.length-1}
  resetForm();if(ed<0)$("name").focus();else setTimeout(function(){var el=document.querySelector('li[data-i="'+ed+'"]');if(el){el.scrollIntoView({block:"center",behavior:"smooth"});el.classList.add("flash");setTimeout(function(){el.classList.remove("flash")},1800)}},50);
  save();render();
}
F.forEach(function(f){var o=document.createElement("option");o.value=f.k;o.textContent=f.t;$("freq").appendChild(o)});
for(var m=1;m<=12;m++){(function(m){var b=document.createElement("button");b.type="button";b.setAttribute("data-m",m);b.textContent=m+"月";b.onclick=function(){var i=selM.indexOf(m),n=selM.slice();if(i>=0)n.splice(i,1);else n.push(m);setM(n)};$("mgrid").appendChild(b)})(m)}
F.forEach(function(f){var b=document.createElement("button");b.type="button";b.setAttribute("data-k",f.k);b.textContent=f.t.split(" ")[0];b.onclick=function(){$("freq").value=f.k;$("freq").onchange()};$("fgrid").appendChild(b)});
$("freq").onchange=function(){toggleStart();var f=fdef(this.value),el=f.pick?$("monthrow"):null;if(el)setTimeout(function(){el.scrollIntoView({block:"center",behavior:"smooth"})},150)};
$("bal").addEventListener("input",function(){var v=num(this.value);bal=v;balDate=ds(today());this.value=/[0-9０-９]/.test(this.value)?v.toLocaleString("ja-JP"):"";save();render()});
$("add").onclick=addItem;
$("cancel").onclick=function(){var ed=editIdx;resetForm();if(ed>=0)goItem(ed)};
$("exp").onclick=function(){$("io").value=exportText();$("io").focus();$("io").select();ioMsg("残高・給料日・項目を書き出しました。「コピー」を押してください。")};
$("cpy").onclick=function(){var t=exportText();$("io").value=t;var ok=function(){ioMsg("コピーしました。")},ng=function(){$("io").focus();$("io").select();try{document.execCommand("copy")?ok():ioMsg("文字を長押ししてコピーしてください。")}catch(e){ioMsg("文字を長押ししてコピーしてください。")}};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,ng)}else ng()};
$("impadd").onclick=function(){doImport(false)};
$("imprep").onclick=function(){doImport(true)};
$("pay").addEventListener("change",function(){payday=this.value;save();render()});
$("amt").addEventListener("keydown",function(e){if(e.key==="Enter")addItem()});
load();
if(bal)$("bal").value=bal.toLocaleString("ja-JP");
if(payday)$("pay").value=payday;
resetForm();
render();
</script>
</body>
</html>
